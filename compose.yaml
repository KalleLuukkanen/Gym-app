services:
  client:
    build: client
    restart: unless-stopped
    volumes:
      - ./client/src:/app/src
    ports:
      - 5173:5173
    depends_on:
      - server

  server:
    build: server
    restart: unless-stopped
    volumes:
      - ./server:/app
      - /app/node_modules
      - ./project.env:/app/.env
    ports:
      - 8000:8000
    depends_on:
      - database
